name: CI

on:
  push:
    branches: [main, master, develop, feature/*]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy app

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      # Updating the coverage data branch.
      contents: write
      pull-requests: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: randomcoffee_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5434 && break
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5434/randomcoffee_test"
          DEBUG: "true"
          TELEGRAM_BOT_TOKEN: "test:token"
          CHANNEL_ID: "@test_channel"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          uv run alembic upgrade head

      - name: Run tests
        env:
          TEST_DATABASE_HOST: localhost
          TEST_DATABASE_PORT: "5434"
          TEST_DATABASE_USER: postgres
          TEST_DATABASE_PASSWORD: postgres
          TEST_DATABASE_NAME: randomcoffee_test
          DEBUG: "true"
          TELEGRAM_BOT_TOKEN: "test:token"
          CHANNEL_ID: "@test_channel"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term --cov-fail-under=80

      # Dependabot and fork PRs get a read-only token, so the comment is skipped
      # there (the step still exits 0). Adding it back needs the `workflow_run`
      # workflow from the action's docs.
      - name: Coverage badge and PR comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # Green above the current ~90%, orange while it drifts toward the 80% gate.
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 80

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install security tools
        run: pip install safety pip-audit

      - name: Export dependencies
        run: uv export --format requirements-txt --output-file requirements.txt

      - name: Run safety check
        run: safety check --file requirements.txt || true

      - name: Run pip-audit
        run: pip-audit --requirement requirements.txt || true
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.ref == 'refs/heads/master'

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/randomcoffeebot:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/randomcoffeebot:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/randomcoffeebot:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/randomcoffeebot:buildcache,mode=max

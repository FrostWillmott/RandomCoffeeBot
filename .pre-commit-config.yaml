repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # Local hook instead of mirrors-mypy: strict mode needs the real project
  # dependencies (aiogram, sqlalchemy) that the isolated mirror env lacks.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy app
        language: system
        types: [python]
        pass_filenames: false
